name: Playwright Tests

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Format & Type Check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (non-TS)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run tsc:check

      - name: Test coverage tooling
        run: npm run coverage:test

      - name: Unit tests
        run: npm run test:unit

      - name: Validate scenario catalog and collected IDs
        run: npm run coverage:validate

  test:
    needs: quality
    runs-on: ubuntu-26.04
    environment: dev
    timeout-minutes: 10
    env:
      BASE_URL: http://localhost:3000
      EMPTY_USER_EMAIL: ${{ secrets.EMPTY_USER_EMAIL }}
      EMPTY_USER_PASSWORD: ${{ secrets.EMPTY_USER_PASSWORD }}
      EMPTY_USER_DISPLAY_NAME: ${{ vars.EMPTY_USER_DISPLAY_NAME }}
      DEMO_USER_EMAIL: ${{ secrets.DEMO_USER_EMAIL }}
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
      DEMO_USER_DISPLAY_NAME: ${{ vars.DEMO_USER_DISPLAY_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout Rolnopol 1.126.0
        uses: actions/checkout@v5
        with:
          repository: jaktestowac/rolnopol
          ref: fb7fd89f4473f841cfa1560ce4979fe11b81bf6e
          path: .local/rolnopol
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: cache-browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-v2-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-v2-

      - name: Install Playwright browsers
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright browser dependencies
        if: steps.cache-browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Prepare Rolnopol
        run: |
          git -C .local/rolnopol apply ../../patches/rolnopol-cookie.patch
          npm ci --prefix .local/rolnopol

      - name: Start Rolnopol
        working-directory: .local/rolnopol
        env:
          NODE_ENV: test
          PORT: '3000'
        run: npm run start > "$RUNNER_TEMP/rolnopol.log" 2>&1 &

      - name: Wait for rolnopol service
        shell: bash
        run: |
          healthcheck_url="${BASE_URL%/}/api/v1/healthcheck"
          echo "Waiting for rolnopol at ${healthcheck_url}..."

          for attempt in {1..20}; do
            if curl --silent --show-error --fail --max-time 5 --output /dev/null "$healthcheck_url"; then
              node -e "fetch(process.env.BASE_URL + '/api/v1/healthcheck').then(r => r.json()).then(r => { if (r.data.status !== 'healthy' || r.data.version !== '1.126.0') process.exit(1); }).catch(() => process.exit(1))"
              echo "Service is ready"
              exit 0
            fi

            echo "Attempt ${attempt}/20 failed; retrying in 2 seconds..."
            sleep 2
          done

          echo "Service did not start at ${healthcheck_url}" >&2
          exit 1

      - name: Run Playwright tests
        run: npm run coverage:run

      - name: Preserve available coverage evidence
        if: ${{ success() || failure() }}
        run: |
          if [ ! -f coverage-report/index.html ]; then
            npm run coverage:collect
            npm run coverage:report
          fi

      - name: Upload Playwright HTML Report
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: rolnopol-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            coverage-report/
          retention-days: 30
