name: Playwright Tests

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Format & Type Check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (non-TS)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run tsc:check

      - name: Test coverage tooling
        run: npm run coverage:test

      - name: Unit tests
        run: npm run test:unit

      - name: Validate scenario IDs and README index
        run: npm run coverage:validate

  test:
    needs: quality
    runs-on: ubuntu-26.04
    environment: dev
    timeout-minutes: 10
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      EMPTY_USER_EMAIL: ${{ secrets.EMPTY_USER_EMAIL }}
      EMPTY_USER_PASSWORD: ${{ secrets.EMPTY_USER_PASSWORD }}
      EMPTY_USER_DISPLAY_NAME: ${{ vars.EMPTY_USER_DISPLAY_NAME }}
      DEMO_USER_EMAIL: ${{ secrets.DEMO_USER_EMAIL }}
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
      DEMO_USER_DISPLAY_NAME: ${{ vars.DEMO_USER_DISPLAY_NAME }}
    services:
      rolnopol:
        image: jaktestowac/rolnopol:1.126.0@sha256:e496a86a035e5c68d081cdec92f1518e197c2ab62853abbfdf1128d46c42747e
        ports:
          - 3000:3000
        env:
          NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: cache-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-

      - name: Install Playwright browsers
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser dependencies
        if: steps.cache-browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Wait for rolnopol service
        run: |
          for attempt in {1..20}; do
            if curl --fail --max-time 5 "$BASE_URL/api/v1/healthcheck"; then
              echo "Service is ready"
              exit 0
            fi

            echo "Service is not ready, waiting..."
            sleep 2
          done

          echo "Service did not start"
          exit 1

      - name: Run Playwright tests
        run: npm run coverage:run

      - name: Preserve available coverage evidence
        if: ${{ success() || failure() }}
        run: |
          if [ ! -f coverage-report/index.html ]; then
            npm run coverage:collect
            npm run coverage:report
          fi

      - name: Upload Playwright HTML Report
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: rolnopol-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            coverage-report/
          retention-days: 30
