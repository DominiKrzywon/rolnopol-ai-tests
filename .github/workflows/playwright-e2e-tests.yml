name: Playwright Tests

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Format & Type Check
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (non-TS)
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run tsc:check

      - name: Test coverage tooling
        run: npm run coverage:test

      - name: Unit tests
        run: npm run test:unit

      - name: Validate scenario IDs and README index
        run: npm run coverage:validate

  test:
    needs: quality
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute
      options: --ipc=host
    defaults:
      run:
        shell: bash
    environment: dev
    timeout-minutes: 10
    env:
      BASE_URL: 'http://rolnopol:3000'
      EMPTY_USER_EMAIL: ${{ secrets.EMPTY_USER_EMAIL }}
      EMPTY_USER_PASSWORD: ${{ secrets.EMPTY_USER_PASSWORD }}
      EMPTY_USER_DISPLAY_NAME: ${{ vars.EMPTY_USER_DISPLAY_NAME }}
      DEMO_USER_EMAIL: ${{ secrets.DEMO_USER_EMAIL }}
      DEMO_USER_PASSWORD: ${{ secrets.DEMO_USER_PASSWORD }}
      DEMO_USER_DISPLAY_NAME: ${{ vars.DEMO_USER_DISPLAY_NAME }}
    services:
      rolnopol:
        image: jaktestowac/rolnopol:1.126.0@sha256:e496a86a035e5c68d081cdec92f1518e197c2ab62853abbfdf1128d46c42747e
        ports:
          - 3000:3000
        env:
          NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for rolnopol service
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL is not set"
            exit 1
          fi
          TARGET_URL="${BASE_URL%/}"
          echo "Waiting for rolnopol service to be ready at ${TARGET_URL}..."
          for i in {1..30}; do
            if curl -sSf "${TARGET_URL}/health" || curl -sSf "${TARGET_URL}"; then
              echo "Service is ready!"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 2 seconds..."
            sleep 2
          done
          echo "Service failed to become ready after 60 seconds"
          exit 1

      - name: Run Playwright tests
        run: npm run coverage:run

      - name: Preserve available coverage evidence
        if: ${{ success() || failure() }}
        run: |
          if [ ! -f coverage-report/index.html ]; then
            npm run coverage:collect
            npm run coverage:report
          fi

      - name: Upload Playwright HTML Report
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: rolnopol-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            coverage-report/
          retention-days: 30
